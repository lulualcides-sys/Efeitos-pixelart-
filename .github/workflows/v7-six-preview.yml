name: V7 — six independent pixel-art move animation checks
on:
  push:
    branches:
      - feat/v7-six-original-pixelart-20261108
    paths:
      - 'vfx-v7/**'
      - '.github/workflows/v7-six-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vfx-v7/**'
      - '.github/workflows/v7-six-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser QA packages
        run: python -m pip install --quiet Pillow==11.3.0 playwright==1.55.0
      - name: Verify installed Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Test 96 PNG frames, SHA256, selectors, play/pause/impact in desktop and mobile Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python vfx-v7/tests/test_gallery.py
      - name: Save real browser screenshots without modifying any game source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-six-moves-pixelart-chrome-evidence
          path: vfx-v7/evidence/*.png
          if-no-files-found: warn
          retention-days: 21
