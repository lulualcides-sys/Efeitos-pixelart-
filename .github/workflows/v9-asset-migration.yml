name: V9 import five illustrated 16-frame PNG spritesheets
on:
  push:
    branches:
      - feat/five-moves-v9-spritesheet-integration-20261108
    paths:
      - 'tools/v9-one-time-import.py'
      - '.github/workflows/v9-asset-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-five-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/five-moves-v9-spritesheet-integration-20261108
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python V9 PNG import source
        run: python -m py_compile tools/v9-one-time-import.py
      - name: Install Pillow and convert user-created spritesheets
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Fetch ephemeral signed previews and permanently commit transparent 16-frame PNGs
        run: python tools/v9-one-time-import.py
      - name: Check all five 320px indexed PNGs have transparency and distinct frames
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,hashlib
          folder=Path('assets/v9')
          data=json.loads((folder/'manifest.json').read_text())
          assert list(data['items'])==['flame-burst','frost-breath','razor-shell','shadow-punch','meteor-mash']
          assert not data['approved'] and not data['gameIntegrationEnabled']
          assert data['airSlashPreserved']=='v8'
          for name,meta in data['items'].items():
              path=folder/(name+'.png')
              b=path.read_bytes()
              assert b[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert hashlib.sha256(b).hexdigest()==meta['sha256']
              im=Image.open(path).convert('RGBA')
              assert im.size==(320,320)
              frames=[im.crop(((i%4)*80,(i//4)*80,((i%4)+1)*80,((i//4)+1)*80)) for i in range(16)]
              assert all(f.getbbox() for f in frames[:-1]),name
              assert len({hashlib.sha256(f.tobytes()).hexdigest() for f in frames})==16,name
              print('PASS',name,meta['transportResolution'],len(b),'bytes')
          PY
      - name: Commit art only to V9 feature branch; leave approved V8 untouched
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v9/
          if git diff --cached --quiet; then
            echo "V9 PNGs already committed"
          else
            git commit -m "assets(vfx): import five genuine 16-cel illustrated move spritesheets into V9"
            git push origin HEAD:feat/five-moves-v9-spritesheet-integration-20261108
          fi
