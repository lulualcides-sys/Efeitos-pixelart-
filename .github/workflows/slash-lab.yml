name: PixelArt VFX - Slash Arc QA
on:
  push:
    branches: [feat/slash-arcos-refinados-20261107]
  pull_request:
    paths:
      - 'effects/slash/**'
      - 'src/**'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/slash-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spritesheet-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check VFX Phaser adapter
        run: npm run check
      - name: Verify original and refined arc 12-frame sheets
        run: npm test
  phaser-webgl-gallery:
    needs: spritesheet-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Playwright runner
        run: npm install --no-audit --no-fund
      - name: Test actual WebGL desktop and mobile
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Archive real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-arc-slash-v2-screenshots
          path: evidence/slash-v2/*.png
          if-no-files-found: warn
          retention-days: 21
