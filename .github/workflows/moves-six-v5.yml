name: Six Moves V5 Fine Native Pixel Art QA
on:
  push:
    branches: [feat/six-moves-v5-fine-pixel-native-20261108]
  pull_request:
    paths:
      - 'src/build-move-six-v5.mjs'
      - 'src/move-six-v5.js'
      - 'effects/moves/six-v5/**'
      - 'moves-v5.html'
      - 'tests/move-six-v5*'
      - '.github/workflows/moves-six-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse original 180px generator and WebGL renderer
        run: node --check src/build-move-six-v5.mjs && node --check src/move-six-v5.js && node --check tests/move-six-v5-browser.cjs
      - name: Deterministic PNG tests, source pixel density and all regressions
        run: npm test

  chromium-webgl:
    needs: native-sprites
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned Playwright browser controller
        run: npm install --no-audit --no-fund
      - name: Play six 180px native animations on actual desktop and mobile WebGL
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/move-six-v5-browser.cjs
      - name: Publish V5 impact, breakup and comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-moves-v5-fine-pixel-webgl-screenshots
          path: evidence/moves-six-v5/*.png
          if-no-files-found: warn
          retention-days: 21
